name: Build and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
  # From lodestone.yml once it's committed new maintenance or events, its push doesn't start this on its own
  workflow_call:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The branch as it is now, so a deploy from lodestone.yml has the data it just committed
          ref: ${{ github.ref }}
          # The whole history, the sitemap's lastmod comes from when each page's data last changed
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build
        env:
          # The crafting pages take it past Node's default heap, the runner has 16 GB
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 5
          command: npx wrangler@4.152.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
