<dialog class="modal map-modal" id="map-modal" closedby="any" aria-labelledby="map-title">
  <div class="modal-header">
    <div>
      <h2 class="title" id="map-title"></h2>
      <div class="map-subtitle" id="map-subtitle"></div>
      <div class="map-subtitle" id="map-aetheryte-name" hidden></div>
      <p class="map-note" id="map-note"></p>
    </div>
    <button class="close-btn" id="map-close" aria-label="Close">&times;</button>
  </div>
  <!-- The map at its full size, the frame shows the part around the spot and can be dragged around -->
  <div class="map" id="map-frame">
    <div class="map-canvas" id="map-canvas">
      <img id="map-image" alt="" width="1024" height="1024" draggable="false">
      <div class="map-area" id="map-area"></div>
      <div class="map-aetheryte" id="map-aetheryte" hidden></div>
      <div class="map-pin" id="map-pin"></div>
    </div>
  </div>
</dialog>
