<meta charset="utf-8">
<!-- viewport-fit=cover lets the page reach under a notch or home bar, the CSS keeps clear of them with env(safe-area-inset-*) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">

<!-- Theme and day/night colors before the first paint so they never flash -->
<script>
  (() => {
    const root = document.documentElement
    root.classList.add("js")
    let theme = null
    try { theme = localStorage.getItem("theme") } catch {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
    root.dataset.theme = theme
    document.querySelector("meta[name=theme-color]").content = theme === "light" ? "#f7f7f7" : "#1a1a1a"

    // The same phases as PHASES in js/utils/theme.js, which can't be imported here before the first paint
    const hour = Math.floor(Date.now() / 175000) % 24
    root.dataset.time = hour < 5 ? "night" : hour < 8 ? "dawn" : hour < 17 ? "day" : hour < 20 ? "dusk" : "night"
  })()
</script>

<!-- Chrome and Edge prerender a page when its link is hovered, so the click shows it at once. The lists are only
     fetched, building every row and running the page for a hover nobody clicks would cost a phone too much -->
<script type="speculationrules">
  {
    "prerender": [{
      "where": { "and": [{ "href_matches": "/*" }, { "not": { "href_matches": ["/fishing/", "/gathering/", "/sightseeing/"] } }] },
      "eagerness": "moderate"
    }],
    "prefetch": [{ "where": { "href_matches": ["/fishing/", "/gathering/", "/sightseeing/"] }, "eagerness": "moderate" }]
  }
</script>
