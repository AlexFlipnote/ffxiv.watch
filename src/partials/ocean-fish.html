<li class="{{ fish.class }}">
  <span class="bait-step"><img class="bait-icon" src="/images/game/{{ fish.icon }}.webp" alt="" width="24" height="24"><a href="{{ fish.url }}">{{ fish.name }}</a></span><x-if value="fish.blue"><span class="chip chip-gold" title="{{ fish.blue.title }}">{{ fish.blue.text }}</span></x-if>
  <span class="ocean-catch"><x-if value="fish.bait"><span class="bait-step"><img class="bait-icon" src="/images/game/{{ fish.bait.icon }}.webp" alt="" width="24" height="24">{{ fish.bait.name }}</span></x-if><x-if value="fish.tug"><span class="bait-step"><span class="tug" aria-hidden="true"><x-each items="fish.tug.marks" as="mark"><i></i></x-each></span>{{ fish.tug.name }}</span></x-if></span><x-if value="fish.intuition">
  <span class="ocean-intuition">Intuition: catch {{ fish.intuition }} first</span></x-if>
</li>
