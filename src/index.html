<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html str="partials/head.html"/>
    <x-seo
      title="ffxiv.watch - Resets & Eorzea Time"
      description="Eorzea time, on your time. Live FFXIV timers for daily and weekly resets, housing lottery, Jumbo Cactpot, GATEs and Ocean Fishing."
      keywords="FFXIV, Final Fantasy XIV, FFXIV reset timer, daily reset, weekly reset, Eorzea time, ET clock, Grand Company reset, housing lottery, Jumbo Cactpot, GATE, Ocean Fishing"
    />
  </head>

  <body>
    <x-html str="partials/navbar.html"/>

    <div class="page">
      <h1 class="sr-only">FFXIV Reset Timers and Eorzea Time</h1>
      <main class="timers" id="timers">
        <section class="clock">
          <div class="clock-time" id="et-time">00:00</div>
          <div class="clock-details">
            <div class="clock-date" id="et-date"></div>
            <div class="clock-earth">
              <div><strong>Local (<span id="local-zone">GMT</span>)</strong> <span id="local-time"></span></div>
              <div><strong>Server (UTC)</strong> <span id="server-time"></span></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="modal" id="modal">
      <div class="modal-header">
        <h2 class="title" id="modal-title"></h2>
        <button class="close-btn" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-info"></p>
        <ul id="modal-list"></ul>
      </div>
    </dialog>

    <x-js src="index.js"/>
  </body>
</html>
