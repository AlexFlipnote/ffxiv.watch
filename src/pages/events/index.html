<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo
      title="FFXIV Events: Seasonal & Collaboration Events On Now"
      description="The FFXIV seasonal and collaboration events on now and coming up, when each starts and ends in your local time, from the Lodestone."
      name="Events"
    />
    <!-- A module waits for the page like defer, from here it downloads while the rest of the page does -->
    <x-js src="/js/events.js" module/>
  </head>

  <body>
    <x-html src="partials/navbar.html"/>

    <div class="page">
      <main class="listing events events-pending">
        <header class="listing-intro">
          <h1 class="listing-title">Events</h1>
          <p class="listing-lead">The seasonal and collaboration events on now and coming up, when each starts and ends in your local time, from the Lodestone.</p>
        </header>
        <section class="events-section" id="events-now" aria-labelledby="events-now-title" hidden="{{ events.noneOn }}">
          <h2 class="events-heading" id="events-now-title">On now</h2>
          <div class="events-grid">
            <x-each items="events.on" as="event">
              <x-html src="partials/event-card.html"/>
            </x-each>
          </div>
        </section>
        <section class="events-section" id="events-soon" aria-labelledby="events-soon-title" hidden="{{ events.noneSoon }}">
          <h2 class="events-heading" id="events-soon-title">Coming up</h2>
          <div class="events-grid">
            <x-each items="events.soon" as="event">
              <x-html src="partials/event-card.html"/>
            </x-each>
          </div>
        </section>
        <p class="events-empty" id="events-empty" hidden="{{ events.anyLive }}">
          Nothing's on right now. The <a href="https://eu.finalfantasyxiv.com/lodestone/topics/" target="_blank" rel="noopener">Lodestone's topics</a> announce the next one, usually a week or two ahead.
        </p>
      </main>
      <x-html src="partials/footer.html"/>
    </div>

    <x-html src="partials/settings.html"/>
  </body>
</html>
