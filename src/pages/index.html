<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html str="partials/head.html"/>
    <x-seo
      title="FFXIV Timers: Daily & Weekly Resets, Eorzea Time"
      description="Live FFXIV timers: daily reset at 15:00 UTC, weekly reset Tuesdays at 08:00 UTC, housing lottery, leve allowances, Jumbo Cactpot, Ocean Fishing and Eorzea time."
    />
  </head>

  <body>
    <x-html str="partials/navbar.html"/>

    <div class="page">
      <h1 class="sr-only">FFXIV Reset Timers and Eorzea Time</h1>
      <main class="timers" id="timers">
        <section class="clock">
          <div class="clock-time" id="et-time">00:00</div>
          <div class="clock-details">
            <div class="clock-date" id="et-date"></div>
            <div class="clock-earth">
              <div><strong>Local (<span id="local-zone">GMT</span>)</strong> <span id="local-time"></span></div>
              <div><strong>Server (UTC)</strong> <span id="server-time"></span></div>
            </div>
          </div>
        </section>
        {{{ timers }}}
      </main>
      <x-html str="partials/footer.html"/>
    </div>

    <x-html str="partials/settings.html"/>

    <dialog class="modal" id="modal" closedby="any" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="title" id="modal-title"></h2>
        <button class="close-btn" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-when"></p>
        <p id="modal-info"></p>
        <ul id="modal-list"></ul>
        <a class="modal-link" id="modal-link" hidden></a>
      </div>
    </dialog>

    <x-js src="index.js"/>
  </body>
</html>
