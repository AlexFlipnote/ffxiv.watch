<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo
      title="FFXIV Timers: Daily & Weekly Resets, Eorzea Time"
      description="Live FFXIV timers: daily reset at 15:00 UTC, weekly reset Tuesdays at 08:00 UTC, housing lottery, leve allowances, Jumbo Cactpot, Ocean Fishing and Eorzea time."
    />
  </head>

  <body>
    <x-html src="partials/navbar.html"/>

    <div class="page">
      <main class="timers timers-pending" id="timers">
        <h1 class="sr-only">FFXIV Reset Timers and Eorzea Time</h1>
        <!-- Shown before the first paint, so the page doesn't drop under it. The week is MAINTENANCE_AHEAD in js/index.js -->
        <x-html src="partials/maintenance.html"/>
        <section class="clock">
          <div class="clock-time" id="et-time">00:00</div>
          <div class="clock-details">
            <div class="clock-date" id="et-date"></div>
            <div class="clock-earth">
              <div><strong>Local (<span id="local-zone">GMT+0</span>)</strong> <span id="local-time">00:00:00</span></div>
              <div><strong>Server (UTC)</strong> <span id="server-time">00:00:00</span></div>
            </div>
          </div>
        </section>
        <!-- As of the build, index.js finds them by data-id and fills in the countdowns. The hidden details are the modal's text, for search engines only -->
        <x-each items="timers" as="timer">
        <div class="{{ timer.class }}" data-id="{{ timer.id }}">
          <div class="timer-header">
            <h2 class="title"><x-if value="timer.page"><a href="{{ timer.page }}">{{ timer.name }}</a></x-if><x-if not="timer.page">{{ timer.name }}</x-if></h2>
            <button class="info-btn" title="Details" aria-label="Details about {{ timer.name }}">i</button>
          </div><x-if value="timer.regions">
          <div class="region-picker" role="group" aria-label="Region">
            <x-each items="timer.regions" as="region"><button class="region-btn">{{ region }}</button></x-each>
          </div></x-if>
          <div class="timer-body">
            <div>
              <div class="countdown">{{ timer.countdown }}</div>
              <div class="target"><strong>{{ timer.targetLabel }}:</strong> <time>{{ timer.target }}</time></div>
            </div>
            <div class="side-col" hidden="{{ timer.noNote }}"><div class="sub-title">{{ timer.note }}</div></div>
          </div>
          <div class="timer-details" hidden><x-if value="timer.when"><p>{{ timer.when }}</p></x-if><x-each items="timer.details" as="detail"><p>{{ detail }}</p></x-each><x-if value="timer.list"><ul><x-each items="timer.list" as="item"><li>{{ item }}</li></x-each></ul></x-if><x-if value="timer.link"><p><a href="{{ timer.link.url }}">{{ timer.link.text }}</a></p></x-if></div>
        </div>
        </x-each>
      </main>
      <x-html src="partials/footer.html"/>
    </div>

    <x-html src="partials/settings.html"/>

    <dialog class="modal" id="modal" closedby="any" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="title" id="modal-title"></h2>
        <button class="close-btn" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-when"></p>
        <p id="modal-info"></p>
        <ul id="modal-list"></ul>
        <a class="modal-link" id="modal-link" hidden></a>
      </div>
    </dialog>

    <x-js src="/js/index.js"/>
  </body>
</html>
