<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo
      title="FFXIV Weather Forecast for Every Zone"
      description="FFXIV weather forecast for every zone, town, housing district and field operation: the weather now and the next periods, in your local time."
      name="Weather"
    />
    <!-- A module waits for the page like defer, from here it downloads while the rest of the page does -->
    <x-js src="/js/weather.js" module/>
  </head>

  <body>
    <x-html src="partials/navbar.html"/>

    <div class="page">
      <main class="listing">
        <header class="listing-intro">
          <h1 class="listing-title">Weather forecast</h1>
          <p class="listing-lead">The weather in every zone of FFXIV, now and for the periods after it, in your local time.</p>
        </header>
        <div class="filters">
          <input class="input search" id="search" type="search" enterkeyhint="search" placeholder="Zone or weather" aria-label="Search">
          <label>Region <select class="select" id="filter-region"><option value="">All</option><x-each items="weather.groups" as="group"><option value="{{ group.slug }}" selected="{{ group.selected }}">{{ group.name }}</option></x-each></select></label>
        </div>
        <div class="weather" id="weather">
          <!-- Now and the periods after it, js/weather.js fills them in. A phone shows the first four, see _weather.scss -->
          <div class="weather-head-sentinel" id="weather-head-sentinel"></div>
          <div class="weather-head" id="weather-head">
            <span class="weather-head-zone">Zone</span>
            <span class="weather-period"><strong>Now</strong><span class="weather-period-sub" id="weather-change"></span></span>
            <span class="weather-period"><time></time><span class="weather-period-sub"></span></span>
            <span class="weather-period"><time></time><span class="weather-period-sub"></span></span>
            <span class="weather-period"><time></time><span class="weather-period-sub"></span></span>
            <span class="weather-period"><time></time><span class="weather-period-sub"></span></span>
            <span class="weather-period"><time></time><span class="weather-period-sub"></span></span>
          </div>
          <x-each items="weather.groups" as="group">
            <section class="{{ group.class }}" data-group="{{ group.slug }}">
              <h2 class="weather-group-title"><span class="group-tab">{{ group.name }}</span></h2>
              <div class="weather-zones">
                <x-each items="group.zones" as="zone">
                  <div class="weather-row" data-zone="{{ zone.name }}">
                    <a class="weather-zone" href="{{ zone.url }}">{{ zone.name }}</a><span class="weather-cell"></span><span class="weather-cell"></span><span class="weather-cell"></span><span class="weather-cell"></span><span class="weather-cell"></span><span class="weather-cell"></span>
                  </div>
                </x-each>
              </div>
            </section>
          </x-each>
        </div>
        <p class="table-empty" id="weather-empty" hidden></p>
      </main>
      <x-html src="partials/footer.html"/>
    </div>

    <x-html src="partials/settings.html"/>
  </body>
</html>
