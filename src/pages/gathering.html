<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html str="partials/head.html"/>
    <x-seo
      title="Gathering Nodes & Timers: Every Item, Unspoiled & Legendary - ffxiv.watch"
      description="Every FFXIV gathering node and where to find each item, with timers for unspoiled, legendary and ephemeral nodes, folklore books and maps."
    />
  </head>

  <body>
    <x-html str="partials/navbar.html"/>

    <div class="page">
      <h1 class="sr-only">FFXIV Gathering Node Timers</h1>
      <main class="listing">
        <section class="listing-panel">
          <div class="filters">
            <input class="input search" id="search" type="search" placeholder="Item, zone or folklore" aria-label="Search">
            <label>Job
              <select class="select" id="filter-job">
                <option value="">Any</option>
                <option>Miner</option>
                <option>Botanist</option>
              </select>
            </label>
            <label>Expansion <select class="select" id="filter-expansion"></select></label>
            <label>Type
              <select class="select" id="filter-type">
                <option value="">Any</option>
                <option value="Timed">Timed</option>
                <option>Legendary</option>
                <option>Unspoiled</option>
                <option>Ephemeral</option>
                <option>Regular</option>
                <option>Diadem</option>
              </select>
            </label>
          </div>
          <table class="table listing-table">
            <thead class="sr-only">
              <tr><th>Items</th><th>Location</th></tr>
            </thead>
            <tbody id="nodes"></tbody>
          </table>
          <p class="table-empty" id="nodes-empty" hidden></p>
        </section>
      </main>
    </div>

    <x-html str="partials/map-modal.html"/>

    <x-js src="gathering.js" module/>
  </body>
</html>
