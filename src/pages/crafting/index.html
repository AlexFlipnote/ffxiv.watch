<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo
      title="FFXIV Crafting Recipes & Materials"
      description="Every FFXIV crafting recipe, with its ingredients, the full craft from scratch, and where each material is gathered, fished or bought."
      name="Crafting"
    />
    <!-- A module waits for the page like defer, from here it downloads while the rest of the page does -->
    <x-js src="/js/crafting.js" module preload="/js/data/crafting/{{ defaultExpansion }}.json"/>
    <link rel="preload" href="{{ defaultRows }}" as="fetch" crossorigin>
  </head>

  <body>
    <x-html src="partials/navbar.html"/>

    <div class="page">
      <main class="listing">
        <header class="listing-intro">
          <h1 class="listing-title">Crafting recipes</h1>
          <p class="listing-lead">How to craft anything in FFXIV: what goes into it, the whole craft from scratch, and where each material is gathered, fished or bought.</p>
        </header>
        <div class="filters">
          <input class="input search" id="search" type="search" enterkeyhint="search" placeholder="Item or recipe book" aria-label="Search">
          <button class="filters-toggle" type="button" aria-expanded="false" aria-label="Filters" title="Filters"></button>
          <label>Job
            <select class="select" id="filter-job">
              <option value="">Any</option>
              <option>Carpenter</option>
              <option>Blacksmith</option>
              <option>Armorer</option>
              <option>Goldsmith</option>
              <option>Leatherworker</option>
              <option>Weaver</option>
              <option>Alchemist</option>
              <option>Culinarian</option>
            </select>
          </label>
          <label>Expansion <select class="select" id="filter-expansion">{{{ expansionOptions }}}</select></label>
        </div>
        <x-html src="partials/listing-skeleton.html"/>
        <table class="table listing-table">
          <thead class="sr-only">
            <tr><th>Recipe</th><th>Crafter</th></tr>
          </thead>
          <tbody id="recipes" data-rows="{{ rowFiles }}"></tbody>
        </table>
        <p class="table-empty" id="recipes-empty" hidden></p>
      </main>
      <x-html src="partials/footer.html"/>
    </div>

    <x-html src="partials/settings.html"/>

    <x-html src="partials/map-modal.html"/>
  </body>
</html>
