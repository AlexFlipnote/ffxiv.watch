<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181818">

    <!-- Theme before the first paint so it never flashes, same logic as js/utils/theme.js -->
    <script>
      (() => {
        let theme = null
        try { theme = localStorage.getItem("theme") } catch {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <!-- Favicon: SVG where supported, .ico (16/32/48px) for the rest, PNG for iOS home screens -->
    <link rel="icon" href="/images/favicon.ico" sizes="32x32">
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

    <!-- Preloaded so nothing shifts when they arrive -->
    <link rel="preload" href="/fonts/google-sans-flex-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/google-sans-flex-700.woff2" as="font" type="font/woff2" crossorigin>

    <link href="/css/index.css?v=77bfcc14" type="text/css" rel="stylesheet">
    <title>Weather Forecast for Every Zone - ffxiv.watch</title>
    <meta name="description" content="Weather forecast for every FFXIV zone. Find the next weather or transition, in your local time.">
    <meta name="keywords" content="FFXIV, Final Fantasy XIV, FFXIV weather, weather forecast, Eorzea weather, Skywatcher, fishing, Sightseeing Log, Eureka weather, Bozja weather">
    <link rel="canonical" href="https://ffxiv.watch/weather/">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ffxiv.watch">
    <meta property="og:title" content="Weather Forecast for Every Zone - ffxiv.watch">
    <meta property="og:description" content="Weather forecast for every FFXIV zone. Find the next weather or transition, in your local time.">
    <meta property="og:url" content="https://ffxiv.watch/weather/">
    <meta property="og:image" content="https://ffxiv.watch/images/banner.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="ffxiv.watch: Eorzea time, on your time.">
    <meta name="twitter:card" content="summary_large_image">
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <button class="navbar-hamburger" aria-label="Menu" aria-expanded="false" aria-controls="navbar-links">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1s.45 1 1 1zm0-5h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1s.45 1 1 1zM3 7c0 .55.45 1 1 1h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1z"/></svg>
        </button>
        <a href="/" class="navbar-title">
          <!-- Inline so the hands can follow the theme -->
          <svg class="navbar-logo" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="none" stroke="#b03131" stroke-width="4"/>
            <g stroke="#b03131" stroke-linecap="round">
              <g stroke-width="3">
                <line x1="32" y1="8" x2="32" y2="12.5"/>
                <line x1="32" y1="8" x2="32" y2="12.5" transform="rotate(90 32 32)"/>
                <line x1="32" y1="8" x2="32" y2="12.5" transform="rotate(180 32 32)"/>
                <line x1="32" y1="8" x2="32" y2="12.5" transform="rotate(270 32 32)"/>
              </g>
              <g stroke-width="2" opacity=".6">
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(30 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(60 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(120 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(150 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(210 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(240 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(300 32 32)"/>
                <line x1="32" y1="8.5" x2="32" y2="10.5" transform="rotate(330 32 32)"/>
              </g>
            </g>
            <g transform="rotate(120 32 32)">
              <polygon points="32,17 36,27 32,32 28,27" style="fill: var(--logo-hand-dark)"/>
              <polygon points="32,17 32,32 28,27" style="fill: var(--logo-hand)"/>
            </g>
            <g transform="rotate(30 32 32)">
              <polygon points="32,11 35,25 32,32 29,25" style="fill: var(--logo-hand)"/>
              <polygon points="32,11 32,32 29,25" style="fill: var(--logo-hand-light)"/>
            </g>
            <circle cx="32" cy="32" r="3" fill="#b03131"/>
          </svg>
          ffxiv.watch
        </a>
        <div class="navbar-links" id="navbar-links">
          <a href="/">Timers</a>
          <a href="/weather/" aria-current="page">Weather</a>
        </div>
        <!-- Shows the theme it switches to -->
        <button class="theme-toggle" aria-label="Switch theme">
          <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
          </svg>
          <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/>
          </svg>
        </button>
      </div>
    </nav>

    <div class="page">
      <h1 class="sr-only">FFXIV Weather Forecast</h1>
      <main class="weather">
        <section class="weather-now">
          <select class="select weather-zone" id="zone" aria-label="Zone"></select>
          <div class="weather-current">
            <div>
              <div class="weather-label">Now</div>
              <div class="weather-name" id="now-weather"></div>
            </div>
            <div class="weather-next">
              <div class="weather-label">Next: <span id="next-weather"></span></div>
              <div class="countdown" id="next-countdown"></div>
              <div class="target"><strong>Changes at:</strong> <time id="next-at"></time></div>
            </div>
          </div>
        </section>

        <section class="weather-forecast">
          <div class="weather-filters">
            <label>From <select class="select" id="filter-from"></select></label>
            <label>To <select class="select" id="filter-to"></select></label>
            <label>At (ET) <select class="select" id="filter-time"></select></label>
          </div>
          <table class="weather-table" id="forecast-table">
            <thead>
              <tr><th>ET</th><th>Weather</th><th class="weather-local">Local time (<span id="local-zone">GMT</span>)</th><th>In</th></tr>
            </thead>
            <tbody id="forecast"></tbody>
          </table>
          <p class="weather-empty" id="forecast-empty" hidden>No match in the next 30 days.</p>
        </section>
      </main>
    </div>

    <script src="/js/weather.js?v=25ad7d1b"></script>
  </body>
</html>
